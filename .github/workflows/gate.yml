# The estate's CI gate (ADR-0002, 2026-07-15): the same plain scripts that run locally,
# run on every push/PR — catching edits the in-session PostToolUse hook can't see
# (human editors, parallel sessions). No new logic lives here; CI only EXECUTES
# release_gate.py (G1–G11, which composes skill_lint/eval_check/corpus_check/docs_check
# and the ruff/eslint style tier) against every plugin.

name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install lint runners
        run: |
          pip install ruff
          npm install --global eslint

      - name: Gate every plugin (G1–G11)
        run: |
          set -e
          fail=0
          for p in "forge 1.14.0" "scribe 0.1.0" "agentic-ui 0.1.0" "llm 0.1.0" \
                   "color 0.1.0" "typography 0.1.0" "design-systems 0.1.0" \
                   "ui 0.1.0" "orchestration 0.1.0"; do
            echo "::group::$p"
            python3 "forge 1.14.0/scripts/release_gate.py" "$p" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Gate scripts prove their own counters
        run: |
          python3 "forge 1.14.0/scripts/release_gate.py" selftest
          python3 "forge 1.14.0/scripts/skill_lint.py" selftest
          python3 "forge 1.14.0/scripts/eval_check.py" selftest
          python3 "forge 1.14.0/scripts/docs_check.py" selftest
          python3 "forge 1.14.0/scripts/corpus_check.py" selftest
          python3 "scribe 0.1.0/scripts/doc_lint.py" selftest
